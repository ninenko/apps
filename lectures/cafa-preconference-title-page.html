<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Preconference Title Page</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;1,8..60,400&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  --ground:#0E141F; --ground-2:#0A0F18; --ink:#F4F6FA; --ink-2:#9DAABF; --ink-3:#66748A;
  --line:#26303F; --accent:#9AAEFF; --accent-deep:#1E2FA8; --ember:#E8B517;
  --sans:"Archivo",system-ui,-apple-system,"Segoe UI",sans-serif;
  --serif:"Source Serif 4",Georgia,serif;
  --mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#000;overflow:hidden}
body{font-family:var(--serif);color:var(--ink);-webkit-font-smoothing:antialiased}
body.idle{cursor:none}

/* fixed 1920x1080 stage, scaled to fit */
#viewport{position:fixed;inset:0;overflow:hidden;background:#000}
#stage{width:1920px;height:1080px;position:absolute;left:50%;top:50%;overflow:hidden;background:var(--ground);transform-origin:center center;transform:translate(-50%,-50%)}

/* ---------- shared background ---------- */
.bg{position:absolute;inset:0;pointer-events:none}
.glow{position:absolute;border-radius:50%;filter:blur(90px);opacity:.55;will-change:transform}
.glow.g1{width:1100px;height:900px;left:980px;top:-380px;background:radial-gradient(circle,rgba(154,174,255,.55),rgba(154,174,255,0) 65%);animation:drift1 38s ease-in-out infinite alternate}
.glow.g2{width:900px;height:800px;left:-320px;top:520px;background:radial-gradient(circle,rgba(232,181,23,.30),rgba(232,181,23,0) 65%);animation:drift2 46s ease-in-out infinite alternate}
.glow.g3{width:700px;height:700px;left:620px;top:420px;background:radial-gradient(circle,rgba(30,47,168,.55),rgba(30,47,168,0) 70%);animation:drift3 54s ease-in-out infinite alternate}
@keyframes drift1{to{transform:translate(-260px,160px) scale(1.12)}}
@keyframes drift2{to{transform:translate(240px,-140px) scale(1.18)}}
@keyframes drift3{to{transform:translate(-200px,-120px) scale(.9)}}
#net{position:absolute;inset:0;width:100%;height:100%;opacity:0;transition:opacity 3s ease}
.grid{position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.028) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.028) 1px,transparent 1px);background-size:80px 80px;mask-image:radial-gradient(ellipse 80% 70% at 50% 45%,#000 30%,transparent 80%)}
.vignette{position:absolute;inset:0;background:radial-gradient(ellipse 120% 90% at 50% 45%,transparent 55%,rgba(0,0,0,.45))}

/* ---------- chrome: top bar + footer on every slide ---------- */
.topbar{position:absolute;left:96px;right:96px;top:64px;display:flex;align-items:center;justify-content:space-between;z-index:5}
.kicker{font-family:var(--mono);font-size:19px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-2);display:flex;align-items:center;gap:18px}
.kicker .dot{width:9px;height:9px;border-radius:50%;background:var(--ember);box-shadow:0 0 18px var(--ember);animation:pulse 4.5s ease-in-out infinite}
@keyframes pulse{50%{opacity:.35;box-shadow:0 0 4px var(--ember)}}
.logos{display:flex;align-items:center;gap:14px}
.chip{background:#fff;border-radius:6px;display:flex;align-items:center;justify-content:center;box-shadow:0 6px 24px rgba(0,0,0,.25)}
.chip.bis{height:64px;padding:8px 12px}
.chip.bis img{height:48px;width:auto;display:block}
.chip.cafa{height:64px;padding:6px 10px}
.chip.cafa img{height:52px;width:auto;display:block}
.footer{position:absolute;left:96px;right:96px;bottom:60px;display:flex;justify-content:space-between;align-items:flex-end;z-index:5;font-family:var(--mono);font-size:17px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3)}
.footer .rule{flex:1;height:1px;background:var(--line);margin:0 32px 9px}

/* ---------- slides ---------- */
.slide{position:absolute;inset:0;opacity:0;visibility:hidden;transition:opacity 1.6s ease,visibility 0s linear 1.6s;z-index:2}
.slide.active{opacity:1;visibility:visible;transition:opacity 1.6s ease,visibility 0s}

/* title slide */
.title-wrap{position:absolute;left:96px;right:96px;top:250px}
.eyebrow{font-family:var(--mono);font-size:24px;letter-spacing:.16em;text-transform:uppercase;color:var(--accent)}
h1{font-family:var(--sans);font-weight:700;font-size:160px;line-height:.98;letter-spacing:-.035em;margin-top:34px;color:var(--ink)}
h1 .word{display:inline-block;white-space:nowrap}
h1 .ch{display:inline-block;opacity:0;transform:translateY(.28em);filter:blur(14px)}
.active h1 .ch{animation:rise 2.6s cubic-bezier(.16,.8,.2,1) forwards}
@keyframes rise{to{opacity:1;transform:none;filter:blur(0)}}
.subtitle{font-family:var(--sans);font-weight:500;font-size:64px;letter-spacing:-.02em;color:var(--ink-2);margin-top:26px;opacity:0}
.active .subtitle{animation:fadeup 3s cubic-bezier(.16,.8,.2,1) 2.4s forwards}
.t-rule{height:2px;margin-top:64px;width:0;background:linear-gradient(90deg,var(--accent),rgba(154,174,255,.15) 60%,transparent)}
.active .t-rule{animation:grow 4.5s cubic-bezier(.45,0,.2,1) 3.2s forwards}
@keyframes grow{to{width:1180px}}
.facts{display:flex;gap:16px;margin-top:44px}
.fact{font-family:var(--mono);font-size:24px;letter-spacing:.08em;text-transform:uppercase;border:1px solid var(--line);border-radius:3px;padding:16px 24px;background:rgba(255,255,255,.03);color:var(--ink);opacity:0}
.fact.lead{border-color:var(--accent);color:var(--accent)}
.active .fact{animation:fadeup 2.4s cubic-bezier(.16,.8,.2,1) forwards}
.active .fact:nth-child(1){animation-delay:4.4s}
.active .fact:nth-child(2){animation-delay:4.9s}
.active .fact:nth-child(3){animation-delay:5.4s}
@keyframes fadeup{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
.title-slide .eyebrow{opacity:0}
.title-slide.active .eyebrow{animation:fadeup 2.4s ease .3s forwards}

/* speaker slides */
.spk{position:absolute;left:96px;right:96px;top:170px;bottom:150px;display:grid;grid-template-columns:640px 1fr;gap:110px;align-items:center}
.portrait-wrap{position:relative;width:640px;height:640px}
.ring{position:absolute;inset:-34px;border-radius:50%;border:1.5px solid rgba(154,174,255,.28)}
.ring.r2{inset:-64px;border-color:rgba(154,174,255,.10);border-style:dashed}
.orbit{position:absolute;inset:-34px;border-radius:50%;animation:spin 60s linear infinite}
.orbit::before{content:"";position:absolute;top:-7px;left:50%;width:14px;height:14px;margin-left:-7px;border-radius:50%;background:var(--ember);box-shadow:0 0 22px 4px rgba(232,181,23,.55)}
.orbit.o2{inset:-64px;animation-duration:95s;animation-direction:reverse}
.orbit.o2::before{width:9px;height:9px;margin-left:-4.5px;top:-4.5px;background:var(--accent);box-shadow:0 0 16px 3px rgba(154,174,255,.6)}
@keyframes spin{to{transform:rotate(360deg)}}
.portrait{position:absolute;inset:0;border-radius:50%;overflow:hidden;box-shadow:0 0 0 6px rgba(255,255,255,.06),0 40px 120px rgba(0,0,0,.55)}
.portrait img{width:100%;height:100%;object-fit:cover;display:block;transform:scale(1.02)}
.slide.active .portrait img{animation:kenburns 40s ease-in-out infinite alternate}
@keyframes kenburns{to{transform:scale(1.09) translate(-1%,-1.5%)}}
.slide .portrait-wrap{opacity:0;transform:scale(.94)}
.slide.active .portrait-wrap{animation:popin 2.4s cubic-bezier(.16,.8,.2,1) .2s forwards}
@keyframes popin{to{opacity:1;transform:none}}
.who .num{font-family:var(--mono);font-size:22px;letter-spacing:.18em;text-transform:uppercase;color:var(--accent);display:flex;align-items:center;gap:20px}
.who .num::after{content:"";width:120px;height:1px;background:var(--accent);opacity:.6}
.who h2{font-family:var(--sans);font-weight:700;font-size:128px;line-height:.96;letter-spacing:-.035em;margin-top:30px}
.who h2 span{display:block}
.who .role{font-family:var(--sans);font-weight:500;font-size:46px;line-height:1.2;letter-spacing:-.012em;color:var(--ink);margin-top:48px;max-width:980px}
.who .org{font-family:var(--mono);font-size:26px;letter-spacing:.1em;text-transform:uppercase;color:var(--ember);margin-top:22px;line-height:1.5}
.who .note{font-family:var(--serif);font-style:italic;font-size:32px;line-height:1.45;color:var(--ink-2);margin-top:44px;max-width:900px;padding-left:28px;border-left:2px solid var(--line)}
.who > *{opacity:0}
.slide.active .who > *{animation:fadeup 2s cubic-bezier(.16,.8,.2,1) forwards}
.slide.active .who > :nth-child(1){animation-delay:.5s}
.slide.active .who > :nth-child(2){animation-delay:.8s}
.slide.active .who > :nth-child(3){animation-delay:1.2s}
.slide.active .who > :nth-child(4){animation-delay:1.45s}
.slide.active .who > :nth-child(5){animation-delay:1.8s}

/* progress + hint */
.progress{position:absolute;left:0;bottom:0;height:4px;background:var(--accent);opacity:.55;transition:width 1.2s cubic-bezier(.45,0,.2,1);z-index:6}
#hint{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);font:500 13px/1 var(--mono);letter-spacing:.1em;text-transform:uppercase;color:#9DAABF;background:rgba(14,20,31,.85);border:1px solid #26303F;padding:10px 16px;border-radius:99px;transition:opacity .8s;z-index:10}
body.idle #hint{opacity:0}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
}
</style>
</head>

  [].forEach.call(document.querySelectorAll('.title-h1'),function(h){var i=0;
  h.innerHTML=h.textContent.split(' ').map(function(w){
    return '<span class="word">'+w.split('').map(function(c){return '<span class="ch" style="animation-delay:'+(0.6+(i++)*0.075).toFixed(3)+'s">'+c+'</span>';}).join('')+'</span>';
  }).join(' ');});

  /* slides */
  var slides=[].slice.call(document.querySelectorAll('.slide')),cur=0;
  var counter=document.getElementById('counter'),prog=document.getElementById('progress'),net=document.getElementById('net');
  function pad(n){return (n<10?'0':'')+n;}
  function show(n){
    n=Math.max(0,Math.min(slides.length-1,n));
    slides[cur].classList.remove('active');
    var s=slides[n];void s.offsetWidth; s.classList.add('active');cur=n;
    counter.textContent=pad(n+1)+' / '+pad(slides.length);
    prog.style.width=((n+1)/slides.length*100)+'%';
    net.style.opacity=s.dataset.net?'1':'.35';window.__pulsesOn=!!s.dataset.net;
    try{history.replaceState(null,'','#'+(n+1));}catch(e){}
  }
  var start=parseInt((location.hash||'').slice(1),10);
  show(isNaN(start)?0:start-1);
  addEventListener('keydown',function(e){
    if(['ArrowRight','ArrowDown','PageDown',' ','Enter'].indexOf(e.key)>-1){e.preventDefault();show(cur+1);}
    else if(['ArrowLeft','ArrowUp','PageUp','Backspace'].indexOf(e.key)>-1){e.preventDefault();show(cur-1);}
    else if(e.key==='Home')show(0);
    else if(e.key==='End')show(slides.length-1);
    else if(e.key==='f'||e.key==='F'){if(!document.fullscreenElement)document.documentElement.requestFullscreen&&document.documentElement.requestFullscreen();else document.exitFullscreen();}
    else if(/^[1-9]$/.test(e.key))show(+e.key-1);
  });
  document.addEventListener('click',function(e){show(e.clientX<innerWidth*0.25?cur-1:cur+1);});

  /* hide cursor + hint when idle */
  var t;function wake(){document.body.classList.remove('idle');clearTimeout(t);t=setTimeout(function(){document.body.classList.add('idle');},2500);}
  addEventListener('mousemove',wake);wake();

  /* slow-motion constellation + calm signal pulses (title slides only) */
  var ctx=net.getContext('2d'),W=1920,H=1080,N=70,pts=[],R2=52000;
  var reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
  for(var k=0;k<N;k++)pts.push({x:Math.random()*W,y:Math.random()*H,vx:(Math.random()-.5)*.09,vy:(Math.random()-.5)*.09,r:Math.random()*1.8+.8,p:Math.random()*6.28,warm:Math.random()<.14,f:0});
  var pulses=[],trails=[],nextPulse=2500,last=performance.now(),SPEED=95;
  function d2(a,b){var dx=pts[a].x-pts[b].x,dy=pts[a].y-pts[b].y;return dx*dx+dy*dy;}
  function startPulse(){
    for(var tries=0;tries<25;tries++){
      var s=Math.floor(Math.random()*N),P=pts[s];
      if(P.x<60||P.x>W-60||P.y<60||P.y>H-60)continue;
      var path=[s];
      for(var h=0;h<7;h++){var cur=path[path.length-1],nb=[];
        for(var j=0;j<N;j++){if(path.indexOf(j)<0){var dd=d2(cur,j);if(dd<R2*.8)nb.push([dd,j]);}}
        if(!nb.length)break; nb.sort(function(x,y){return x[0]-y[0];});
        path.push(nb[Math.floor(Math.random()*Math.min(3,nb.length))][1]);}
      if(path.length>=4){pts[s].f=1;pulses.push({path:path,seg:0,t:0});return;}
    }
  }
  function frame(now){
    now=now||performance.now();var dt=Math.min(64,now-last);last=now;
    ctx.clearRect(0,0,W,H);
    for(var a=0;a<N;a++){var A=pts[a];A.x+=A.vx;A.y+=A.vy;A.p+=.006;A.f=Math.max(0,A.f-dt/2600);
      if(A.x<-40)A.x=W+40;if(A.x>W+40)A.x=-40;if(A.y<-40)A.y=H+40;if(A.y>H+40)A.y=-40;}
    ctx.lineWidth=1;
    for(a=0;a<N;a++)for(var b=a+1;b<N;b++){var d=d2(a,b);
      if(d<R2){ctx.strokeStyle='rgba(154,174,255,'+(0.16*(1-d/R2)).toFixed(3)+')';ctx.beginPath();ctx.moveTo(pts[a].x,pts[a].y);ctx.lineTo(pts[b].x,pts[b].y);ctx.stroke();}}
    /* pulses */
    var on=window.__pulsesOn!==false;
    if(on&&!reduce){nextPulse-=dt;if(nextPulse<=0&&pulses.length<2){startPulse();nextPulse=3800+Math.random()*2400;}}
    for(var i=trails.length-1;i>=0;i--){var T=trails[i];T.life-=dt/3800;if(T.life<=0){trails.splice(i,1);continue;}
      ctx.strokeStyle='rgba(170,188,255,'+(0.42*T.life).toFixed(3)+')';ctx.lineWidth=1.4;
      ctx.beginPath();ctx.moveTo(pts[T.a].x,pts[T.a].y);ctx.lineTo(pts[T.b].x,pts[T.b].y);ctx.stroke();}
    for(i=pulses.length-1;i>=0;i--){var Q=pulses[i],pa=pts[Q.path[Q.seg]],pb=pts[Q.path[Q.seg+1]];
      var L=Math.sqrt(d2(Q.path[Q.seg],Q.path[Q.seg+1]))||1;Q.t+=dt*SPEED/1000/L;
      if(Q.t>=1){pb.f=1;trails.push({a:Q.path[Q.seg],b:Q.path[Q.seg+1],life:1});Q.seg++;Q.t=0;
        if(Q.seg>=Q.path.length-1){pulses.splice(i,1);continue;}
        pa=pts[Q.path[Q.seg]];pb=pts[Q.path[Q.seg+1]];}
      var e=Q.t<.5?2*Q.t*Q.t:1-Math.pow(-2*Q.t+2,2)/2;
      var hx=pa.x+(pb.x-pa.x)*e,hy=pa.y+(pb.y-pa.y)*e;
      var g=ctx.createLinearGradient(pa.x,pa.y,hx,hy);g.addColorStop(0,'rgba(170,188,255,0.05)');g.addColorStop(1,'rgba(214,224,255,0.55)');
      ctx.strokeStyle=g;ctx.lineWidth=1.6;ctx.beginPath();ctx.moveTo(pa.x,pa.y);ctx.lineTo(hx,hy);ctx.stroke();
      var rg=ctx.createRadialGradient(hx,hy,0,hx,hy,16);rg.addColorStop(0,'rgba(230,236,255,0.75)');rg.addColorStop(.35,'rgba(154,174,255,0.28)');rg.addColorStop(1,'rgba(154,174,255,0)');
      ctx.fillStyle=rg;ctx.beginPath();ctx.arc(hx,hy,16,0,6.283);ctx.fill();}
    for(a=0;a<N;a++){A=pts[a];var al=.45+.35*Math.sin(A.p);
      if(A.f>0){var fr=ctx.createRadialGradient(A.x,A.y,0,A.x,A.y,22);var c=A.warm?'232,181,23':'170,188,255';
        fr.addColorStop(0,'rgba('+c+','+(0.45*A.f).toFixed(3)+')');fr.addColorStop(1,'rgba('+c+',0)');
        ctx.fillStyle=fr;ctx.beginPath();ctx.arc(A.x,A.y,22,0,6.283);ctx.fill();}
      ctx.fillStyle=A.warm?'rgba(232,181,23,'+Math.min(1,al+.5*A.f)+')':'rgba(200,212,255,'+Math.min(1,al+.5*A.f)+')';
      ctx.beginPath();ctx.arc(A.x,A.y,A.r*(A.warm?1.5:1)+1.6*A.f,0,6.283);ctx.fill();}
    if(!reduce)requestAnimationFrame(frame);
  }
  frame();
})();
</script>
</body>
</html>
