<style>
  :root {
    --bg: #f5f4f1; --panel: #ffffff; --ink: #1c1b1a; --muted: #6b6863;
    --line: #e3e0da; --accent: #8a6d3b; --good: #3f7a4d; --bad: #b3492f;
    --warn: #b8860b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 0 0 4rem; background: var(--bg); color: var(--ink);
    font: 15px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  }
  header {
    position: sticky; top: 0; z-index: 5; background: var(--panel);
    border-bottom: 1px solid var(--line); padding: .75rem 1rem;
  }
  h1 { font-size: 1.05rem; margin: 0 0 .5rem; }
  .controls { display: flex; flex-wrap: wrap; gap: .5rem; align-items: center; }
  .toggle { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  .toggle button {
    border: 0; background: var(--panel); padding: .4rem .8rem; cursor: pointer; font: inherit;
  }
  .toggle button.active { background: var(--accent); color: #fff; }
  input[type=text] {
    flex: 1 1 200px; padding: .45rem .6rem; border: 1px solid var(--line);
    border-radius: 8px; font: inherit; min-width: 140px;
  }
  .progress { font-size: .85rem; color: var(--muted); margin-left: auto; }
  button.export {
    border: 1px solid var(--accent); background: var(--accent); color: #fff;
    padding: .45rem .8rem; border-radius: 8px; font: inherit; cursor: pointer;
  }
  main { padding: 1rem; max-width: 900px; margin: 0 auto; }
  .excluded { background: #fff7e6; border: 1px solid #e7cf9a; border-radius: 10px;
    padding: .75rem 1rem; margin-bottom: 1.25rem; }
  .excluded h2 { font-size: .95rem; margin: 0 0 .5rem; }
  .excl-item { display: flex; gap: .75rem; padding: .5rem 0; border-top: 1px solid #eedcae; }
  .excl-item:first-of-type { border-top: 0; }
  .excl-item img { width: 90px; border-radius: 6px; border: 1px solid var(--line); }
  .excl-meta { flex: 1; }
  .excl-meta .why { color: var(--muted); font-size: .85rem; }
  .excl-controls select, .excl-controls input { font: inherit; padding: .3rem; margin-top: .3rem; }
  .card {
    background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
    margin-bottom: 1rem; overflow: hidden;
  }
  .card > summary {
    padding: .6rem .9rem; cursor: pointer; font-weight: 600; list-style: none;
    display: flex; justify-content: space-between; gap: .5rem;
  }
  .card > summary::-webkit-details-marker { display: none; }
  .card > summary .count { color: var(--muted); font-weight: 400; }
  .item { border-top: 1px solid var(--line); padding: .75rem .9rem; display: grid;
    grid-template-columns: 130px 1fr; gap: .75rem; }
  .item img { width: 100%; border-radius: 6px; border: 1px solid var(--line); cursor: zoom-in; }
  .item .field { margin: 0 0 .3rem; }
  .item .label { color: var(--muted); font-size: .78rem; text-transform: uppercase; letter-spacing: .02em; }
  .item .value { font-size: .95rem; }
  .badge { display: inline-block; padding: .05rem .5rem; border-radius: 999px; font-size: .78rem; }
  .badge.correct { background: #e4f2e6; color: var(--good); }
  .badge.wrong { background: #fbe7e2; color: var(--bad); }
  .badge.other { background: #fbf1da; color: var(--warn); }
  .decide { display: flex; gap: .5rem; margin-top: .5rem; flex-wrap: wrap; }
  .decide select, .decide input[type=text] { font: inherit; padding: .35rem; border: 1px solid var(--line); border-radius: 6px; }
  .decide select { min-width: 120px; }
  .decide input[type=text] { flex: 1 1 160px; }
  .decided { outline: 2px solid var(--good); outline-offset: -2px; }
  @media (max-width: 520px) {
    .item { grid-template-columns: 1fr; }
    .item img { max-width: 220px; }
  }
</style>

const EXCLUDED = [{"code": "D16", "file": "Diag8_NoName_20260915-1644.pdf", "prompt_short": "Unnamed spare copy - confirm exclusion from marking", "why": "visually confirmed spare copy, no answers (16 Sept)", "crop": "D16_sheet.jpg"}, {"code": "D17", "file": "Diag8_NoName_20260915-1645.pdf", "prompt_short": "Unnamed spare copy - confirm exclusion from marking", "why": "visually confirmed spare copy, no answers (16 Sept)", "crop": "D17_sheet.jpg"}, {"code": "D18", "file": "Diag8_NoName_20260915-1646.pdf", "prompt_short": "Unnamed spare copy - confirm exclusion from marking", "why": "visually confirmed spare copy, no answers (16 Sept)", "crop": "D18_sheet.jpg"}];
const STATUS_OPTIONS = ["correct", "wrong", "no_response", "unreadable", "exclude"];
const STORE_KEY = "d8check_v2";
const TOTAL = RECORDS.length;

function loadStore() {
  try {
    const raw = localStorage.getItem(STORE_KEY);
    return raw ? JSON.parse(raw) : {};
  } catch (e) { return {}; }
}
function saveStore(store) {
  try { localStorage.setItem(STORE_KEY, JSON.stringify(store)); } catch (e) {}
}
let STORE = loadStore();

function keyFor(r) { return r.code + "|" + r.blank_id; }
function studentLabel(r) {
  return PUBLIC_MODE ? r.code : (r.code + (r.name ? " - " + r.name : ""));
}
function badgeClass(status) {
  if (status === "correct") return "correct";
  if (status === "wrong") return "wrong";
  return "other";
}

function updateProgress() {
  let decided = 0;
  RECORDS.forEach(r => { if ((STORE[keyFor(r)] || {}).status) decided++; });
  document.getElementById("progress").textContent = decided + " of " + TOTAL + " decided";
}

function itemHtml(r, showStudent) {
  const st = STORE[keyFor(r)] || {};
  const decidedClass = st.status ? "decided" : "";
  const qLabel = "Q" + r.q_num + (r.q_part || "");
  const header = showStudent ? studentLabel(r) : (qLabel + " - " + r.prompt_short);
  return `
  <div class="item ${decidedClass}" data-key="${keyFor(r)}" data-search="${(qLabel + ' ' + r.prompt_short + ' ' + studentLabel(r)).toLowerCase()}">
    <img src="img/${r.crop}" loading="lazy" alt="${qLabel} crop" onclick="window.open(this.src)">
    <div>
      <div class="field"><span class="label">${showStudent ? 'Question' : 'Student'}</span><div class="value">${showStudent ? qLabel + ' - ' + r.prompt_short : studentLabel(r)}</div></div>
      <div class="field"><span class="label">Key answer</span><div class="value">${r.key_answer || '(n/a)'}</div></div>
      <div class="field"><span class="label">AI read</span><div class="value">${r.read_as || '(nothing read)'}</div></div>
      <div class="field"><span class="label">Proposed</span><div class="value"><span class="badge ${badgeClass(r.proposed_status)}">${r.proposed_status}</span></div></div>
      <div class="field"><span class="label">Why uncertain</span><div class="value">${r.why}</div></div>
      <div class="decide">
        <select class="statusSel">
          <option value="">-- decide --</option>
          ${STATUS_OPTIONS.map(o => `<option value="${o}" ${st.status===o?'selected':''}>${o}</option>`).join("")}
        </select>
        <input type="text" class="noteInput" placeholder="note (optional)" value="${(st.note||'').replace(/"/g,'&quot;')}">
      </div>
    </div>
  </div>`;
}

function groupHtml(title, items, showStudent) {
  const count = items.length;
  return `<details class="card" open>
    <summary>${title} <span class="count">${count} to check</span></summary>
    ${items.map(r => itemHtml(r, showStudent)).join("")}
  </details>`;
}

function render() {
  const mode = document.getElementById("tabQuestion").classList.contains("active") ? "question" : "student";
  const groups = document.getElementById("groups");
  let html = "";
  if (mode === "question") {
    const byQ = {};
    RECORDS.forEach(r => { (byQ[r.q_sort] = byQ[r.q_sort] || []).push(r); });
    Object.keys(byQ).sort().forEach(q => {
      const items = byQ[q];
      const label = "Q" + items[0].q_num + (items[0].q_part || "") + " - " + items[0].prompt_short;
      html += groupHtml(label, items, false);
    });
  } else {
    const byS = {};
    RECORDS.forEach(r => { (byS[r.code] = byS[r.code] || []).push(r); });
    Object.keys(byS).sort((a,b) => {
      const oa = byS[a][0].student_order, ob = byS[b][0].student_order;
      return oa - ob;
    }).forEach(code => {
      const items = byS[code].sort((a,b) => a.q_sort.localeCompare(b.q_sort));
      html += groupHtml(studentLabel(items[0]), items, true);
    });
  }
  groups.innerHTML = html;
  attachHandlers();
  applyFilter();
  updateProgress();
}

function attachHandlers() {
  document.querySelectorAll(".item").forEach(el => {
    const key = el.getAttribute("data-key");
    const sel = el.querySelector(".statusSel");
    const note = el.querySelector(".noteInput");
    sel.addEventListener("change", () => {
      STORE[key] = STORE[key] || {};
      STORE[key].status = sel.value;
      saveStore(STORE);
      el.classList.toggle("decided", !!sel.value);
      updateProgress();
    });
    note.addEventListener("input", () => {
      STORE[key] = STORE[key] || {};
      STORE[key].note = note.value;
      saveStore(STORE);
    });
  });
}

function applyFilter() {
  const q = document.getElementById("filter").value.trim().toLowerCase();
  document.querySelectorAll(".card").forEach(card => {
    let anyVisible = false;
    card.querySelectorAll(".item").forEach(item => {
      const match = !q || item.getAttribute("data-search").includes(q);
      item.style.display = match ? "" : "none";
      if (match) anyVisible = true;
    });
    card.style.display = anyVisible ? "" : "none";
  });
}

function renderExcluded() {
  const store = STORE;
  const list = document.getElementById("excludedList");
  list.innerHTML = EXCLUDED.map(r => {
    const key = "exclude|" + r.code;
    const st = store[key] || {};
    return `<div class="excl-item" data-exkey="${key}">
      <img src="img/${r.crop}" loading="lazy" alt="${r.code} page 1">
      <div class="excl-meta">
        <div><strong>${r.code}</strong> - ${r.file}</div>
        <div class="why">${r.why}</div>
        <div class="excl-controls">
          <select class="exSel">
            <option value="">-- decide --</option>
            <option value="confirm_exclude" ${st.status==='confirm_exclude'?'selected':''}>Confirm: exclude (spare copy)</option>
            <option value="reject_exclude" ${st.status==='reject_exclude'?'selected':''}>Reject: include in marking</option>
          </select>
          <input type="text" class="exNote" placeholder="note (optional)" value="${(st.note||'').replace(/"/g,'&quot;')}">
        </div>
      </div>
    </div>`;
  }).join("");
  list.querySelectorAll(".excl-item").forEach(el => {
    const key = el.getAttribute("data-exkey");
    const sel = el.querySelector(".exSel");
    const note = el.querySelector(".exNote");
    sel.addEventListener("change", () => { STORE[key] = STORE[key] || {}; STORE[key].status = sel.value; saveStore(STORE); });
    note.addEventListener("input", () => { STORE[key] = STORE[key] || {}; STORE[key].note = note.value; saveStore(STORE); });
  });
}

function csvEscape(v) {
  v = (v === undefined || v === null) ? "" : String(v);
  if (/[",\n]/.test(v)) return '"' + v.replace(/"/g, '""') + '"';
  return v;
}

function exportCsv() {
  const cols = ["code", "first_name", "file", "blank_id", "prompt_short", "key_answer", "read_as", "proposed_status", "why", "crop", "ivan_status", "ivan_note", "q_num", "q_part", "q_sort", "student_order", "name"];
  const lines = [cols.join(",")];
  RECORDS.forEach(r => {
    const st = STORE[keyFor(r)] || {};
    const row = Object.assign({}, r, { ivan_status: st.status || "", ivan_note: st.note || "" });
    if (!("name" in row)) row.name = "";
    if (!("first_name" in row)) row.first_name = PUBLIC_MODE ? "" : (row.name || "");
    if (!("file" in row)) row.file = "";
    lines.push(cols.map(c => csvEscape(row[c])).join(","));
  });
  EXCLUDED.forEach(r => {
    const key = "exclude|" + r.code;
    const st = STORE[key] || {};
    const row = { code: r.code, first_name: "", file: r.file, blank_id: "EXCLUDED_SPARE",
      prompt_short: r.prompt_short, key_answer: "", read_as: "", proposed_status: "exclude",
      why: r.why, crop: r.crop, ivan_status: st.status || "", ivan_note: st.note || "",
      q_num: "", q_part: "", q_sort: "", student_order: "", name: "" };
    lines.push(cols.map(c => csvEscape(row[c])).join(","));
  });
  const blob = new Blob([lines.join("\r\n")], { type: "text/csv;charset=utf-8" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "CHECK-for-Ivan_v2.csv";
  document.body.appendChild(a);
  a.click();
  a.remove();
}

document.getElementById("tabQuestion").addEventListener("click", () => {
  document.getElementById("tabQuestion").classList.add("active");
  document.getElementById("tabStudent").classList.remove("active");
  render();
});
document.getElementById("tabStudent").addEventListener("click", () => {
  document.getElementById("tabStudent").classList.add("active");
  document.getElementById("tabQuestion").classList.remove("active");
  render();
});
document.getElementById("filter").addEventListener("input", applyFilter);
document.getElementById("exportBtn").addEventListener("click", exportCsv);

renderExcluded();
render();
</script>
</body>
</html>
